
name: Flask Docker CI/CD

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t flask-api:latest .

      - name: Verify Docker Image
        run: docker images
